[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemsdoe64"
version = "0.1.0"
description = "Fail-closed expected-DTI selection research"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.14", "scikit-learn>=1.5", "rasterio>=1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest>=8", "Markdown>=3.7"]
