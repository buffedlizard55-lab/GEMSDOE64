[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gems64"
version = "0.1.0"
description = "Expected-DTI-optimal emission for the DOE GEMS Prize (DrivenData 306)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
